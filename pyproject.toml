[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confclean-fc"
version = "1.1.4"
description = "Fedora & RPM system cleaner and orphan configuration purger"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "James Turansky" }
]
urls = { Homepage = "https://builddesigncreate.com" }
keywords = ["cleaner", "fedora", "rpm", "cache", "orphan-config", "pyqt6", "system-maintenance"]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5.0",
]

[project.scripts]
confclean = "main:main"
confclean-fc = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["confclean*"]
